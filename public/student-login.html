<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login - Canning Town TSD</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Serif+JP:wght@600;900&display=swap"
    rel="stylesheet">
</head>

<body>
  <div class="portal-page">
    <div class="portal-card">
      <div class="portal-brand">
        <img src="/images/gblogo.webp" alt="Canning Town TSD">
        <div>
          <div class="brand-sub">MASTER ROSILLO REGISTER 2026</div>
          <h1 class="brand-name" style="font-size: 1.15rem;">CANNING TOWN TSD</h1>
        </div>
      </div>

      <div class="portal-title">🥋 Student Progress Login</div>
      <p class="portal-desc">
        Enter your first name and your Association Number to view your attendance and grading progress.
      </p>

      <div class="portal-error" id="login-error"></div>

      <form id="student-login-form" class="modal-form" style="padding: 0;">
        <div class="form-group">
          <label for="login-first-name">First Name</label>
          <input type="text" id="login-first-name" required class="form-control" autocomplete="given-name"
            placeholder="e.g. Liam">
        </div>
        <div class="form-group">
          <label for="login-association-no">Association Number</label>
          <input type="text" id="login-association-no" required class="form-control" autocomplete="off"
            placeholder="e.g. 234726">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">View My Progress</button>
      </form>
    </div>
  </div>

  <script src="student.js"></script>
</body>

</html>
